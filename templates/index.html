<!doctype html>
<html>
  <head>
    <title>ReliefRoute</title>
  </head>
  <body>
    <h1>ReliefRoute — Doha Disaster Resource Router</h1>
    {{ map_html | safe }}

    <h3>Road Closures</h3>
    <form action="/update_roads" method="post">
      {% for road_id, road in closable_roads.items() %}
      <label>
        <input
          type="checkbox"
          name="closed"
          value="{{ road_id }}"
          {%
          if
          closed_roads[road_id]
          %}checked{%
          endif
          %}
        />
        {{ road.label }} </label
      ><br />
      {% endfor %}
      <button type="submit">Apply</button>
    </form>
  </body>
</html>
